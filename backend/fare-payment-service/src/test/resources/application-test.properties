spring.datasource.url=jdbc:h2:mem:ridelink_fare_payment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
ridelink.account-service-url=http://localhost:18081
ridelink.driver-service-url=http://localhost:18082
ridelink.ride-service-url=http://localhost:18083
ridelink.jwt-secret=test-only-secret-at-least-thirty-two-characters-long
ridelink.jwt-issuer=ridelink-account-service
ridelink.service-token-expiration-ms=60000

spring.application.name=fare-payment-service
server.port=8084

spring.datasource.url=${FARE_DB_URL:jdbc:postgresql://localhost:5432/ridelink_fare_payments}
spring.datasource.username=${FARE_DB_USERNAME:postgres}
spring.datasource.password=${FARE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

ridelink.account-service-url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
ridelink.driver-service-url=${DRIVER_SERVICE_URL:http://localhost:8082}
ridelink.ride-service-url=${RIDE_SERVICE_URL:http://localhost:8083}
ridelink.jwt-secret=${JWT_SECRET}
ridelink.jwt-issuer=ridelink-account-service
ridelink.service-token-expiration-ms=60000

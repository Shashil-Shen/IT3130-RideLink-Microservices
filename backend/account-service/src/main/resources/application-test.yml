spring:
  datasource:
    url: jdbc:h2:mem:ridelink_accounts;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

security:
  jwt:
    secret: test-only-secret-at-least-thirty-two-characters-long
    expiration-ms: 3600000
    issuer: ridelink-account-service

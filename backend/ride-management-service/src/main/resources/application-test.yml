spring:
  datasource:
    url: jdbc:h2:mem:ridelink_rides;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
ridelink:
  account-service-url: http://localhost:18081
  driver-service-url: http://localhost:18082
  fare-payment-service-url: http://localhost:18084
  jwt-secret: test-only-secret-at-least-thirty-two-characters-long
  jwt-issuer: ridelink-account-service
  service-token-expiration-ms: 60000
  connect-timeout-ms: 500
  read-timeout-ms: 500
